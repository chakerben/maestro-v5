name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm test (version drift, validate.js, budget, bash test suites)
        run: npm test

  bash-suites-macos:
    name: Bash test suites (macOS / BSD tools)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: bash scripts/tests/*.test.sh
        run: for t in scripts/tests/*.test.sh; do echo "▶ $t"; bash "$t" || exit 1; done

  commitlint:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint the PR's commits
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6
      - name: Lint the pushed commit (main)
        if: github.event_name == 'push'
        run: npx --yes -p @commitlint/cli -p @commitlint/config-conventional commitlint --from HEAD~1 --to HEAD
