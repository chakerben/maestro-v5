name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate structure, manifests, and Philosophy compliance
        run: node scripts/validate.js
      - name: Test bash-guard hook (34-case suite)
        run: bash scripts/tests/bash-guard.test.sh
      - name: Test memory-sync hook (10-case regression suite)
        run: bash scripts/tests/memory-sync.test.sh

  commitlint:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
